<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twomi Operations & Request Queue</title>
  <meta name="description" content="Simple dynamic request management dashboard for forms, emails, and CSV/JSON/MD file uploads with live queue, duplicate detection, and Gemini 3.5+ AI auto-triage." />
  <meta property="og:title" content="Twomi Operations & Request Queue" />
  <meta property="og:description" content="Simple dynamic request management dashboard for forms, emails, and CSV/JSON/MD file uploads with live queue, duplicate detection, and Gemini 3.5+ AI auto-triage." />
  
  <!-- Inter & Plus Jakarta Sans typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            twomi: {
              turquoise: '#2dd4bf',
              aqua: '#38bdf8',
              sky: '#5eead4',
              mint: '#6ee7b7',
              dark: '#071822',
              card: '#0c222e',
              surface: '#112b3a',
              border: '#163d4f',
              highlight: '#00f2fe'
            }
          }
        }
      }
    }
  </script>

  <style>
    [x-cloak] { display: none !important; }
    
    /* Authentic Twomi Brand Visual Language from reference artwork */
    :root {
      --twomi-aqua-start: #38c8e8;
      --twomi-aqua-mid: #2dd4bf;
      --twomi-mint-end: #5eead4;
    }

    body {
      background-color: #06151f;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(56, 200, 232, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(45, 212, 191, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(94, 234, 212, 0.1) 0%, transparent 60%);
      background-attachment: fixed;
    }

    .twomi-gradient-text {
      background: linear-gradient(135deg, #ffffff 10%, #6ee7b7 55%, #38c8e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .twomi-badge-pill {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      box-shadow: 0 4px 20px -2px rgba(45, 212, 191, 0.25);
    }

    .twomi-card {
      background: rgba(12, 34, 46, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 200, 232, 0.18);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .twomi-card-nested {
      background: rgba(7, 24, 34, 0.85);
      border: 1px solid rgba(45, 212, 191, 0.18);
    }

    .twomi-button-primary {
      background: linear-gradient(135deg, #38c8e8 0%, #2dd4bf 100%);
      color: #06151f;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(45, 212, 191, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .twomi-button-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(56, 200, 232, 0.45);
    }
    .twomi-button-primary:active {
      transform: translateY(0);
    }

    .twomi-tab-active {
      background: rgba(45, 212, 191, 0.18);
      color: #5eead4;
      border-color: rgba(94, 234, 212, 0.5);
      box-shadow: 0 2px 10px rgba(45, 212, 191, 0.15);
    }

    /* Soft avatar cloud shapes inspired by Twomi logo & reference cards */
    .avatar-scallop {
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    }
    .avatar-clover {
      border-radius: 32px;
    }

    /* Custom high-contrast responsive scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #071822; }
    ::-webkit-scrollbar-thumb { background: #163d4f; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #2dd4bf; }
  </style>
</head>

<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-teal-400 selection:text-slate-950 pb-12 sm:pb-0"
      x-data="twomiApp()" x-init="initApp()" x-cloak>

  <!-- Sticky Global Header: Polished, Modern & Responsive -->
  <header class="sticky top-0 z-40 bg-[#061924]/95 backdrop-blur-md border-b border-cyan-500/20 px-3 sm:px-6 lg:px-8 py-2.5 transition-all shadow-lg shadow-black/20">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 sm:gap-4">
      
      <!-- Brand Logo & Identity -->
      <div class="flex items-center gap-3 cursor-pointer group flex-shrink-0" @click="activeTab = 'queue'">
        <!-- Authentic Twomi Stylized Emblem -->
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-cyan-400 via-teal-400 to-emerald-400 p-[1.5px] shadow-lg shadow-teal-500/20 transition-transform group-hover:scale-105 flex-shrink-0">
          <div class="w-full h-full bg-[#071924] rounded-[9px] sm:rounded-[10px] flex items-center justify-center relative overflow-hidden">
            <svg class="w-5 h-5 text-teal-300 transition-colors group-hover:text-teal-200" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4z" class="fill-teal-500/20 stroke-teal-400" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-lg sm:text-xl font-extrabold tracking-tight text-white group-hover:text-teal-300 transition-colors">twomi</span>
            <span class="text-[10px] sm:text-[11px] font-semibold text-cyan-300 px-2 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-500/30 inline-flex items-center gap-1.5 shadow-inner">
              <span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-pulse"></span>
              <span>Ops Hub</span>
            </span>
          </div>
          <p class="text-[10px] sm:text-[11px] text-teal-200/70 font-medium truncate max-w-[170px] sm:max-w-none" x-text="t('subtitle')"></p>
        </div>
      </div>

      <!-- Quick Metrics Counter (Desktop & Tablet) -->
      <div class="hidden lg:flex items-center gap-2 text-xs">
        <div class="px-2.5 py-1 rounded-xl bg-[#08202d]/90 border border-cyan-500/25 flex items-center gap-1.5 shadow-sm">
          <span class="text-teal-200/70 font-medium" x-text="t('total') + ':'"></span>
          <span class="font-bold text-white font-mono" x-text="queue.length"></span>
        </div>
        <div class="px-2.5 py-1 rounded-xl bg-[#08202d]/90 border border-amber-500/30 flex items-center gap-1.5 shadow-sm">
          <span class="text-amber-200/80 font-medium" x-text="t('flagged') + ':'"></span>
          <span class="font-bold text-amber-300 font-mono" x-text="flaggedCount"></span>
        </div>
        <div class="px-2.5 py-1 rounded-xl bg-[#08202d]/90 border border-emerald-500/30 flex items-center gap-1.5 shadow-sm">
          <span class="text-emerald-200/80 font-medium" x-text="t('resolved') + ':'"></span>
          <span class="font-bold text-emerald-300 font-mono" x-text="resolvedCount"></span>
        </div>
        <template x-if="uploadedFiles.length > 0">
          <div class="px-2.5 py-1 rounded-xl bg-teal-950/70 border border-teal-400/40 text-teal-200 flex items-center gap-1.5 shadow-sm">
            <span>📁</span>
            <span class="font-mono font-bold" x-text="uploadedFiles.length"></span>
            <span class="text-[11px] text-teal-300/80" x-text="t('filesLoaded')"></span>
          </div>
        </template>
      </div>

      <!-- Utility Controls & Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Language Selector -->
        <div class="relative flex items-center">
          <select x-model="currentLang" @change="savePref()"
                  aria-label="Language selector"
                  class="h-9 bg-[#0b2433] hover:bg-[#0f2e42] text-xs font-semibold text-teal-100 border border-cyan-500/30 hover:border-teal-400/60 rounded-xl pl-2.5 pr-6 sm:pr-7 focus:outline-none focus:border-teal-400 cursor-pointer shadow-sm transition-colors appearance-none">
            <option value="en">🇺🇸 EN</option>
            <option value="vi">🇻🇳 VI</option>
            <option value="ja">🇯🇵 JA</option>
          </select>
          <div class="pointer-events-none absolute right-2 text-teal-400/60 text-[9px]">▼</div>
        </div>

        <!-- BYOK Gemini AI Button -->
        <button @click="showKeyModal = true"
                :class="apiKey ? 'border-teal-400/80 text-teal-200 bg-teal-950/70 shadow-sm shadow-teal-500/20' : 'border-cyan-500/30 text-slate-200 bg-[#0b2433] hover:border-teal-400/50 hover:bg-[#0f2e42]'"
                class="h-9 px-2.5 sm:px-3 text-xs font-semibold rounded-xl border transition-all flex items-center gap-1.5 shadow-sm active:scale-95"
                :title="apiKey ? (selectedModelDisplay + ' Active') : t('byok')">
          <svg class="w-3.5 h-3.5 text-teal-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
          <span class="hidden md:inline" x-text="apiKey ? (selectedModelShortLabel + ' Active') : t('byok')"></span>
          <span x-show="apiKey" class="w-2 h-2 rounded-full bg-teal-400 animate-pulse flex-shrink-0"></span>
        </button>

        <!-- Upload Files Button -->
        <button @click="showUploadModal = true"
                class="h-9 px-2.5 sm:px-3 text-xs font-semibold rounded-xl bg-teal-500/15 hover:bg-teal-500/25 border border-teal-400/40 hover:border-teal-400 text-teal-200 transition-all flex items-center gap-1.5 shadow-sm active:scale-95"
                :title="t('uploadModalTitle')">
          <svg class="w-3.5 h-3.5 text-teal-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <span class="hidden sm:inline" x-text="t('btnUploadFile')"></span>
          <span x-show="uploadedFiles.length > 0" class="px-1.5 py-0.2 rounded-full text-[10px] bg-teal-400 text-[#071822] font-bold font-mono" x-text="uploadedFiles.length"></span>
        </button>

        <!-- Export Dropdown -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" 
                  class="h-9 px-2.5 sm:px-3 text-xs font-semibold rounded-xl bg-[#0b2433] hover:bg-[#0f2e42] border border-cyan-500/30 hover:border-teal-400/60 text-slate-200 transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
            <svg class="w-3.5 h-3.5 text-teal-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            <span class="hidden sm:inline" x-text="t('export')"></span>
          </button>
          <div x-show="open" @click.outside="open = false" 
               class="absolute right-0 mt-1.5 w-44 twomi-card rounded-xl shadow-2xl py-1.5 z-50 text-xs border border-cyan-500/30"
               x-transition>
            <button @click="exportData('csv'); open = false" class="w-full text-left px-3.5 py-2 hover:bg-teal-500/10 text-teal-100 flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              Export .CSV
            </button>
            <button @click="exportData('json'); open = false" class="w-full text-left px-3.5 py-2 hover:bg-teal-500/10 text-teal-100 flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
              Export .JSON
            </button>
            <button @click="exportData('md'); open = false" class="w-full text-left px-3.5 py-2 hover:bg-teal-500/10 text-teal-100 flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
              Export Markdown (.MD)
            </button>
          </div>
        </div>

        <!-- Reset to Demo Data -->
        <button @click="resetToDemoData()" :title="t('reset')"
                class="h-9 px-2.5 sm:px-3 text-xs font-semibold text-teal-300/80 hover:text-white bg-[#0b2433] hover:bg-[#0f2e42] border border-cyan-500/30 rounded-xl hover:border-teal-400/60 transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
          <svg class="w-3.5 h-3.5 text-teal-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span class="hidden sm:inline" x-text="t('reset')"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== SIMPLE APP GUIDE (3 STEPS TO UNDERSTAND & USE) ==================== -->
  <section x-show="showSimpleGuide" x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           class="max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 pt-3">
    <div class="twomi-card rounded-2xl p-4 sm:p-5 border border-cyan-500/30 bg-gradient-to-br from-[#071c28]/95 via-[#082232]/90 to-[#0b2b3d]/85 shadow-xl">
      <div class="flex items-center justify-between mb-3 border-b border-cyan-500/20 pb-2.5">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-base">💡</span>
          <h3 class="text-xs sm:text-sm font-bold text-white tracking-wide" x-text="t('simpleGuideTitle')"></h3>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/30 font-semibold" x-text="t('simpleGuideBadge')"></span>
        </div>
        <button @click="toggleSimpleGuide()" class="text-xs text-teal-300/70 hover:text-white flex items-center gap-1 font-medium transition-colors">
          <span x-text="t('collapseGuide')"></span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        </button>
      </div>

      <!-- 3 Visual Step Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">
        
        <!-- Step 1: Multi-Source Intake -->
        <div class="bg-[#051520]/90 border border-cyan-500/25 rounded-xl p-3.5 space-y-2 hover:border-cyan-400/50 transition-colors">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 flex items-center justify-center text-xs font-bold font-mono">
              01
            </div>
            <h4 class="text-xs font-bold text-slate-100" x-text="t('step1Title')"></h4>
          </div>
          <p class="text-[11px] text-teal-100/75 leading-relaxed" x-text="t('step1Desc')"></p>
          <div class="pt-1 flex items-center gap-1.5 text-[10px] text-cyan-300/80 font-mono">
            <span x-text="t('step1Badge1')"></span> • <span x-text="t('step1Badge2')"></span> • <span x-text="t('step1Badge3')"></span>
          </div>
        </div>

        <!-- Step 2: Live Queue Management -->
        <div class="bg-[#051520]/90 border border-teal-500/25 rounded-xl p-3.5 space-y-2 hover:border-teal-400/50 transition-colors">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-teal-500/20 border border-teal-400/40 text-teal-300 flex items-center justify-center text-xs font-bold font-mono">
              02
            </div>
            <h4 class="text-xs font-bold text-slate-100" x-text="t('step2Title')"></h4>
          </div>
          <p class="text-[11px] text-teal-100/75 leading-relaxed" x-text="t('step2Desc')"></p>
          <div class="pt-1 flex items-center gap-1.5 text-[10px] text-teal-300/80 font-mono">
            <span x-text="t('step2Badge1')"></span> • <span x-text="t('step2Badge2')"></span> • <span x-text="t('step2Badge3')"></span>
          </div>
        </div>

        <!-- Step 3: Gemini 3.5+ AI Triage -->
        <div class="bg-[#051520]/90 border border-emerald-500/25 rounded-xl p-3.5 space-y-2 hover:border-emerald-400/50 transition-colors">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 flex items-center justify-center text-xs font-bold font-mono">
              03
            </div>
            <h4 class="text-xs font-bold text-slate-100" x-text="t('step3Title')"></h4>
          </div>
          <p class="text-[11px] text-teal-100/75 leading-relaxed" x-text="t('step3Desc')"></p>
          <div class="pt-1 flex items-center gap-1.5 text-[10px] text-emerald-300/80 font-mono">
            <span x-text="t('step3Badge1')"></span> • <span x-text="t('step3Badge2')"></span> • <span x-text="t('step3Badge3')"></span>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Navigation View Tabs -->
  <div class="max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 mt-4">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-cyan-500/20 pb-3">
      <nav class="flex space-x-1.5 sm:space-x-2">
        <button @click="activeTab = 'queue'"
                :class="activeTab === 'queue' ? 'twomi-tab-active font-bold' : 'text-slate-400 hover:text-teal-200 border-transparent'"
                class="px-3 sm:px-4 py-2 text-xs font-semibold rounded-xl border transition-all flex items-center gap-2">
          <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span x-text="t('tabQueue')"></span>
          <span class="px-2 py-0.5 rounded-full text-[10px] bg-[#071d28] text-teal-300 border border-cyan-500/30 font-mono" x-text="queue.length"></span>
        </button>
        <button @click="activeTab = 'contact'"
                :class="activeTab === 'contact' ? 'twomi-tab-active font-bold' : 'text-slate-400 hover:text-teal-200 border-transparent'"
                class="px-3 sm:px-4 py-2 text-xs font-semibold rounded-xl border transition-all flex items-center gap-2">
          <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span x-text="t('tabContact')"></span>
        </button>
        <button @click="activeTab = 'email'"
                :class="activeTab === 'email' ? 'twomi-tab-active font-bold' : 'text-slate-400 hover:text-teal-200 border-transparent'"
                class="px-3 sm:px-4 py-2 text-xs font-semibold rounded-xl border transition-all flex items-center gap-2">
          <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <span x-text="t('tabEmail')"></span>
        </button>
        <!-- Tab 4: Dynamic Files & Context (CSV, JSON, MD) -->
        <button @click="activeTab = 'context'"
                :class="activeTab === 'context' ? 'twomi-tab-active font-bold' : 'text-slate-400 hover:text-teal-200 border-transparent'"
                class="px-3 sm:px-4 py-2 text-xs font-semibold rounded-xl border transition-all flex items-center gap-2">
          <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          <span x-text="t('tabData')"></span>
          <span x-show="uploadedFiles.length > 0" class="px-2 py-0.5 rounded-full text-[10px] bg-teal-500/20 text-teal-300 border border-teal-500/30 font-mono" x-text="uploadedFiles.length"></span>
        </button>
      </nav>

      <!-- Right Actions: Guide Toggle & Gateway Status -->
      <div class="flex items-center gap-2">
        <button @click="toggleSimpleGuide()"
                class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#071822] hover:bg-[#0c2433] text-teal-300 border border-cyan-500/30 hover:border-teal-400/60 transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
          <span class="text-xs">💡</span>
          <span x-text="showSimpleGuide ? t('hideGuide') : t('simpleGuideToggle')"></span>
        </button>
        <div class="text-xs text-teal-200/80 hidden sm:flex items-center gap-2 bg-[#092230] px-3 py-1.5 rounded-xl border border-cyan-500/20">
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
          <span><span x-text="t('gatewayLabel') || 'Gateway:'"></span> <strong class="text-teal-300" x-text="t('gatewayName') || 'Jump In Live'"></strong></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Responsive Content Container -->
  <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 py-5 flex-1">

    <!-- ==================== TAB 1: OPERATIONS QUEUE ==================== -->
    <section x-show="activeTab === 'queue'" class="space-y-4">

      <!-- Dynamic Uploaded Context Status Alert -->
      <div x-show="uploadedFiles && uploadedFiles.length > 0"
           class="p-3 sm:p-3.5 rounded-2xl bg-gradient-to-r from-[#072430] via-[#092d3e] to-[#072430] border border-cyan-500/35 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 shadow-lg">
        <div class="flex items-center gap-2.5 flex-wrap text-xs">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-400 animate-pulse"></span>
          <span class="font-bold text-white flex items-center gap-1.5">
            📁 <span x-text="t('dynamicContextActive')"></span>:
          </span>
          <span class="text-teal-200 font-mono text-[11px] bg-[#051722] px-2.5 py-1 rounded-lg border border-cyan-500/30" x-text="activeFilesSummary"></span>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <button @click="activeTab = 'context'" class="px-2.5 py-1 rounded-lg bg-teal-500/20 text-teal-200 hover:bg-teal-500/30 border border-teal-400/40 text-[11px] font-semibold transition-colors flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span x-text="t('btnManageContext')"></span>
          </button>
          <button @click="resetToDemoData()" class="px-2 py-1 text-slate-400 hover:text-rose-300 text-[11px] transition-colors" x-text="t('reset')"></button>
        </div>
      </div>
      
      <!-- Responsive Search, Filter and AI Actions Toolbar -->
      <div class="twomi-card p-3 sm:p-4 rounded-2xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
        
        <div class="flex flex-wrap items-center gap-2 flex-1">
          <!-- Live Search Input -->
          <div class="relative flex-1 min-w-[180px]">
            <input type="text" x-model="searchQuery" :placeholder="t('searchPlaceholder')"
                   class="w-full bg-[#071822] text-xs text-slate-100 placeholder-teal-300/40 pl-8 pr-3 py-2 rounded-xl border border-cyan-500/30 focus:outline-none focus:border-teal-400 transition-colors shadow-inner" />
            <svg class="w-3.5 h-3.5 text-teal-300/50 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>

          <!-- Priority Filter -->
          <select x-model="filterPriority" 
                  aria-label="Priority filter"
                  class="bg-[#071822] text-xs text-teal-100 border border-cyan-500/30 rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-400">
            <option value="ALL" x-text="t('allPriorities')"></option>
            <option value="Urgent" x-text="getPriorityLabel('Urgent')"></option>
            <option value="High" x-text="getPriorityLabel('High')"></option>
            <option value="Normal" x-text="getPriorityLabel('Normal')"></option>
            <option value="Low" x-text="getPriorityLabel('Low')"></option>
          </select>

          <!-- Sort by Urgency / Date -->
          <select x-model="sortBy" 
                  aria-label="Sort by"
                  class="bg-[#071822] text-xs text-teal-100 border border-cyan-500/30 rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-400">
            <option value="newest" x-text="t('sortNewest')"></option>
            <option value="oldest" x-text="t('sortOldest')"></option>
            <option value="priority_desc" x-text="t('sortPriorityDesc')"></option>
            <option value="priority_asc" x-text="t('sortPriorityAsc')"></option>
          </select>
          
          <!-- Category Filter -->
          <select x-model="filterCategory" 
                  aria-label="Category filter"
                  class="bg-[#071822] text-xs text-teal-100 border border-cyan-500/30 rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-400">
            <option value="ALL" x-text="t('allCategories')"></option>
            <template x-for="cat in categories" :key="cat">
              <option :value="cat" x-text="getCategoryLabel(cat)"></option>
            </template>
          </select>

          <!-- Status Filter -->
          <select x-model="filterStatus" 
                  aria-label="Status filter"
                  class="bg-[#071822] text-xs text-teal-100 border border-cyan-500/30 rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-400">
            <option value="ALL" x-text="t('allStatuses')"></option>
            <option value="Pending" x-text="t('statusPending')"></option>
            <option value="In Progress" x-text="t('statusInProgress')"></option>
            <option value="Resolved" x-text="t('statusResolved')"></option>
            <option value="Incomplete/Duplicate" x-text="t('statusIncompleteDuplicate')"></option>
          </select>

          <!-- Flagged Edge Cases Only Toggle -->
          <button @click="filterOnlyFlagged = !filterOnlyFlagged"
                  :class="filterOnlyFlagged ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-[#071822] text-slate-400 border-cyan-500/30 hover:text-teal-200'"
                  class="px-2.5 py-2 text-xs font-semibold rounded-xl border transition-colors flex items-center gap-1.5 shadow-sm">
            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span x-text="t('flaggedOnly')"></span>
          </button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <!-- Quick Upload Button -->
          <button @click="showUploadModal = true"
                  class="px-3 py-2 rounded-xl text-xs font-bold bg-[#071d29] hover:bg-[#0c293a] text-teal-300 border border-teal-500/40 hover:border-teal-400 transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95"
                  :title="t('uploadModalTitle')">
            <svg class="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <span x-text="t('btnUploadFile')"></span>
          </button>

          <!-- AI Batch Triage Button -->
          <button @click="runAIBatchCategorize()" :disabled="isAnalyzing"
                  class="twomi-button-primary px-4 py-2 rounded-xl text-xs font-bold disabled:opacity-50 transition-all flex items-center justify-center gap-2">
            <svg class="w-3.5 h-3.5" :class="isAnalyzing ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span x-text="isAnalyzing ? t('analyzingAI') : t('aiAutoTriage')"></span>
          </button>
        </div>
      </div>

      <!-- DESKTOP / TABLET QUEUE TABLE -->
      <div class="twomi-card rounded-2xl overflow-hidden border border-cyan-500/25 shadow-2xl hidden md:block">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-[#081e2b]/95 text-teal-200/90 uppercase tracking-wider font-semibold border-b border-cyan-500/20 text-[11px]">
                <th class="py-3.5 px-4" x-text="t('thSource')"></th>
                <th class="py-3.5 px-4" x-text="t('thSender')"></th>
                <th class="py-3.5 px-4 min-w-[260px]" x-text="t('thMessage')"></th>
                <!-- Sortable Priority Column Header -->
                <th class="py-3.5 px-3 cursor-pointer select-none hover:text-white transition-colors" @click="toggleSortPriority()" :title="t('sortBy')">
                  <div class="flex items-center gap-1.5">
                    <span x-text="t('thPriority')"></span>
                    <span class="text-[10px] text-teal-300 font-mono">
                      <span x-show="sortBy === 'priority_desc'">▼</span>
                      <span x-show="sortBy === 'priority_asc'">▲</span>
                      <span x-show="sortBy !== 'priority_desc' && sortBy !== 'priority_asc'" class="text-teal-200/30">↕</span>
                    </span>
                  </div>
                </th>
                <th class="py-3.5 px-3" x-text="t('thCategory')"></th>
                <th class="py-3.5 px-3" x-text="t('thStatus')"></th>
                <th class="py-3.5 px-3" x-text="t('thAssignee')"></th>
                <th class="py-3.5 px-4 text-right" x-text="t('thActions')"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-cyan-500/10">
              <template x-for="item in filteredQueue" :key="item.id">
                <tr :class="item.isDuplicate ? 'bg-amber-950/20' : (item.isIncomplete ? 'bg-rose-950/20' : 'hover:bg-cyan-950/30')" class="transition-colors">
                  
                  <!-- Source -->
                  <td class="py-3 px-4 align-top">
                    <span :class="getSourceBadgeClass(item.source)" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold border inline-block" x-text="getSourceLabel(item.source)"></span>
                    <div class="text-[10px] text-teal-200/50 font-mono mt-1.5" x-text="formatTime(item.timestamp)"></div>
                  </td>

                  <!-- Sender -->
                  <td class="py-3 px-4 align-top">
                    <div class="font-semibold text-slate-100 flex items-center gap-1.5">
                      <span x-text="item.name || '—'"></span>
                      <template x-if="!item.name">
                        <span class="text-[9px] bg-rose-500/25 text-rose-300 px-1.5 py-0.5 rounded border border-rose-500/30" x-text="t('tagNoName')"></span>
                      </template>
                    </div>
                    <div class="text-teal-200/70 font-mono text-[11px] mt-0.5 truncate max-w-[150px]">
                      <span x-text="item.email || '—'"></span>
                      <template x-if="!item.email || !isValidEmail(item.email)">
                        <span class="text-[9px] bg-amber-500/25 text-amber-300 px-1.5 py-0.2 rounded border border-amber-500/30 ml-1" x-text="t('tagMalformed')"></span>
                      </template>
                    </div>
                    <template x-if="item.vipStatus">
                      <span class="text-[9px] font-bold text-teal-300 uppercase tracking-widest block mt-1" x-text="t('vipCreator')"></span>
                    </template>
                  </td>

                  <!-- Message -->
                  <td class="py-3 px-4 align-top space-y-1">
                    <div class="font-medium text-slate-100 flex items-center gap-2">
                      <span class="font-semibold" x-text="getItemSubject(item)"></span>
                      <template x-if="item.isIncomplete">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-500/25 text-rose-300 border border-rose-500/40 inline-flex items-center gap-1">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                          <span x-text="t('tagIncomplete')"></span>
                        </span>
                      </template>
                      <template x-if="item.isDuplicate">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/25 text-amber-300 border border-amber-500/40 inline-flex items-center gap-1">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                          <span x-text="t('tagDuplicate')"></span>
                        </span>
                      </template>
                    </div>
                    <p class="text-slate-300 line-clamp-2 leading-relaxed text-xs" x-text="getItemMessage(item)"></p>
                    <div class="flex flex-wrap items-center gap-1.5 pt-0.5">
                      <template x-if="item.aiIntent">
                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-teal-950/80 text-teal-200 border border-teal-500/40 inline-flex items-center gap-1">
                          <svg class="w-2.5 h-2.5 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                          <span x-text="getItemIntent(item)"></span>
                        </span>
                      </template>
                      <template x-if="item.sentiment">
                        <span :class="getSentimentClass(item.sentiment)" class="text-[10px] px-2 py-0.5 rounded-md border" x-text="getSentimentLabel(item.sentiment)"></span>
                      </template>
                    </div>
                  </td>

                  <!-- Priority (Interactive selector & badge) -->
                  <td class="py-3 px-3 align-top">
                    <select x-model="item.priority" @change="recordFieldChange(item, 'priority')"
                            :class="getPriorityClass(item.priority)"
                            aria-label="Item priority"
                            class="text-[11px] font-bold border rounded-lg px-2 py-1 focus:outline-none transition-colors">
                      <option value="Urgent" class="bg-[#071822] text-rose-300" x-text="getPriorityLabel('Urgent')"></option>
                      <option value="High" class="bg-[#071822] text-amber-300" x-text="getPriorityLabel('High')"></option>
                      <option value="Normal" class="bg-[#071822] text-teal-300" x-text="getPriorityLabel('Normal')"></option>
                      <option value="Low" class="bg-[#071822] text-slate-300" x-text="getPriorityLabel('Low')"></option>
                    </select>
                  </td>

                  <!-- Category -->
                  <td class="py-3 px-3 align-top">
                    <select x-model="item.category" @change="recordFieldChange(item, 'category')"
                            aria-label="Item category"
                            class="bg-[#071822] text-[11px] text-teal-100 border border-cyan-500/30 rounded-lg px-2 py-1 focus:border-teal-400">
                      <template x-for="cat in categories" :key="cat">
                        <option :value="cat" :selected="item.category === cat" x-text="getCategoryLabel(cat)"></option>
                      </template>
                    </select>
                  </td>

                  <!-- Status -->
                  <td class="py-3 px-3 align-top">
                    <select x-model="item.status" @change="recordFieldChange(item, 'status')"
                            aria-label="Item status"
                            :class="getStatusClass(item.status)"
                            class="text-[11px] font-medium border rounded-lg px-2 py-1 focus:outline-none">
                      <option value="Pending" class="bg-[#071822] text-slate-200" x-text="t('statusPending')"></option>
                      <option value="In Progress" class="bg-[#071822] text-slate-200" x-text="t('statusInProgress')"></option>
                      <option value="Resolved" class="bg-[#071822] text-slate-200" x-text="t('statusResolved')"></option>
                      <option value="Incomplete/Duplicate" class="bg-[#071822] text-slate-200" x-text="t('statusIncompleteDuplicate')"></option>
                    </select>
                  </td>

                  <!-- Assignee -->
                  <td class="py-3 px-3 align-top">
                    <select x-model="item.assignee" @change="recordFieldChange(item, 'assignee')"
                            aria-label="Item assignee"
                            class="bg-[#071822] text-[11px] text-teal-100 border border-cyan-500/30 rounded-lg px-2 py-1 focus:border-teal-400">
                      <option value="Unassigned" x-text="t('assigneeUnassigned')"></option>
                      <option value="Sarah Chen" x-text="getAssigneeLabel('Sarah Chen')"></option>
                      <option value="Marcus Vance" x-text="getAssigneeLabel('Marcus Vance')"></option>
                      <option value="Elena Rostova" x-text="getAssigneeLabel('Elena Rostova')"></option>
                      <option value="Kenji Sato" x-text="getAssigneeLabel('Kenji Sato')"></option>
                    </select>
                  </td>

                  <!-- Actions -->
                  <td class="py-3 px-4 align-top text-right whitespace-nowrap">
                    <div class="flex items-center justify-end gap-1.5">
                      <button @click="openInspect(item)" :title="t('inspectTitle')" 
                              class="p-1.5 text-teal-300 hover:text-white hover:bg-teal-500/20 rounded-lg transition-colors border border-transparent hover:border-teal-400/30">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                      </button>
                      <button @click="copyToClip(JSON.stringify(item, null, 2), t('copyJson'))" :title="t('copyJson')" 
                              class="p-1.5 text-teal-300 hover:text-white hover:bg-teal-500/20 rounded-lg transition-colors border border-transparent hover:border-teal-400/30">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                      </button>
                      <button @click="deleteItem(item.id)" title="Remove" 
                              class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/20 rounded-lg transition-colors border border-transparent hover:border-rose-400/30">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </td>

                </tr>
              </template>

              <!-- Empty state table row -->
              <tr x-show="filteredQueue.length === 0">
                <td colspan="8" class="py-12 text-center text-slate-400">
                  <div class="w-12 h-12 mx-auto mb-2 text-teal-400/50 flex items-center justify-center">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                  </div>
                  <p class="font-semibold text-slate-200" x-text="t('empty')"></p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- MOBILE-FIRST CARD LIST (Visible on < 768px screens for seamless mobile UX) -->
      <div class="block md:hidden space-y-3">
        <template x-for="item in filteredQueue" :key="item.id">
          <div :class="item.isDuplicate ? 'border-amber-500/40 bg-amber-950/20' : (item.isIncomplete ? 'border-rose-500/40 bg-rose-950/20' : 'border-cyan-500/25 bg-[#0c222e]')"
               class="p-4 rounded-2xl border shadow-lg space-y-3">
            
            <!-- Mobile Header: ID, Source, Priority, Date -->
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-mono font-bold text-teal-300" x-text="item.id"></span>
                <span :class="getSourceBadgeClass(item.source)" class="px-2 py-0.5 rounded text-[10px] font-semibold border" x-text="getSourceLabel(item.source)"></span>
                <select x-model="item.priority" @change="recordFieldChange(item, 'priority')"
                        :class="getPriorityClass(item.priority)"

                <label class="text-teal-300/60 block mb-1 font-semibold" x-text="t('thAssignee')"></label>
                <select x-model="selectedItem.assignee" @change="recordFieldChange(selectedItem, 'assignee')"
                        class="w-full bg-[#0c2433] text-teal-100 border border-cyan-500/30 rounded-lg p-1.5 text-xs">
                  <option value="Unassigned" x-text="t('assigneeUnassigned')"></option>
                  <option value="Sarah Chen" x-text="getAssigneeLabel('Sarah Chen')"></option>
                  <option value="Marcus Vance" x-text="getAssigneeLabel('Marcus Vance')"></option>
                  <option value="Elena Rostova" x-text="getAssigneeLabel('Elena Rostova')"></option>
                  <option value="Kenji Sato" x-text="getAssigneeLabel('Kenji Sato')"></option>
                </select>
              </div>
            </div>

            <div>
              <span class="text-teal-200/80 font-semibold mb-1 block" x-text="t('messagePayload')"></span>
              <div class="bg-[#071822] border border-cyan-500/20 rounded-xl p-3 text-slate-200 whitespace-pre-wrap max-h-36 overflow-y-auto leading-relaxed" x-text="getItemMessage(selectedItem)"></div>
            </div>

            <!-- AI Insight Box -->
            <div class="bg-gradient-to-br from-[#0c3140] to-[#081f2b] border border-teal-500/40 rounded-xl p-4 space-y-2.5 shadow-inner">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-teal-300 flex items-center gap-1.5">
                    ✨ <span x-text="t('aiInsightTitle')"></span>
                  </span>
                  <span class="text-[9px] font-mono px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/30 font-semibold"
                        x-text="apiKey ? selectedModelDisplay : 'Local Regex'"></span>
                </div>
                <button @click="analyzeSingle(selectedItem)" :disabled="isAnalyzingSingle" 
                        class="px-2.5 py-1 text-[10px] bg-teal-500/25 hover:bg-teal-500/40 text-teal-200 rounded-lg border border-teal-500/40 transition-colors">
                  <span x-text="isAnalyzingSingle ? t('analyzing') : t('reRunAI')"></span>
                </button>
              </div>
              <div class="grid grid-cols-2 gap-2 text-[11px]">
                <div><span class="text-teal-200/60 block" x-text="t('detectedIntent')"></span> <span class="font-semibold text-slate-100" x-text="getItemIntent(selectedItem) || t('analyzing')"></span></div>
                <div><span class="text-teal-200/60 block" x-text="t('sentiment')"></span> <span :class="getSentimentClass(selectedItem.sentiment)" class="text-[10px] px-2 py-0.5 rounded-md border inline-block mt-0.5" x-text="getSentimentLabel(selectedItem.sentiment)"></span></div>
              </div>

              <!-- Dynamic Grounding Indicator -->
              <template x-if="activeContextFilesCount > 0">
                <div class="flex items-center gap-1.5 text-[10px] text-cyan-300 bg-cyan-950/70 px-2.5 py-1 rounded-lg border border-cyan-500/35">
                  <span>📘</span>
                  <span><strong x-text="t('groundedByContext') + ':'"></strong> <span x-text="activeFilesSummary"></span></span>
                </div>
              </template>
              <template x-if="selectedItem && selectedItem.aiSuggestedReply">
                <div class="pt-2 border-t border-teal-500/20">
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-teal-200/70 font-medium" x-text="t('suggestedReply')"></span>
                    <button @click="copyToClip(getItemReply(selectedItem), t('copyDraft'))" class="text-teal-300 hover:text-white underline text-[10px]" x-text="t('copyDraft')"></button>
                  </div>
                  <p class="bg-[#061822]/90 p-2.5 rounded-lg border border-teal-500/20 text-teal-100 text-[11px] italic leading-relaxed" x-text="getItemReply(selectedItem)"></p>
                </div>
              </template>
            </div>

            <!-- ==================== TICKET HISTORY & AUDIT TIMELINE ==================== -->
            <div class="bg-gradient-to-br from-[#071924] to-[#04121a] border border-cyan-500/35 rounded-xl p-4 space-y-3.5 shadow-lg">
              <div class="flex items-center justify-between border-b border-cyan-500/20 pb-2.5">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-teal-300 font-bold flex items-center gap-1.5 text-xs">
                    <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span x-text="t('ticketHistoryTitle')"></span>
                  </span>
                  <span class="bg-teal-500/20 text-teal-200 border border-teal-500/30 text-[10px] px-2 py-0.5 rounded-full font-mono font-semibold"
                        x-text="(selectedItem.history ? selectedItem.history.length : 0) + ' ' + t('historyUpdatesCount')"></span>
                </div>
                <span class="text-[10px] text-teal-300/70 inline-flex items-center gap-1 font-mono">
                  <span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-pulse"></span>
                  <span x-text="t('historyLiveSync')"></span>
                </span>
              </div>

              <!-- Manual Note / Update Composer -->
              <form @submit.prevent="addTicketNote(selectedItem)" class="flex gap-2">
                <input type="text" x-model="newTimelineNote" :placeholder="t('addNotePlaceholder')"
                       class="flex-1 bg-[#05131c] border border-cyan-500/25 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-teal-300/40 focus:outline-none focus:border-teal-400" />
                <button type="submit" :disabled="!newTimelineNote || !newTimelineNote.trim()"
                        class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-teal-500/20 hover:bg-teal-500/35 text-teal-200 border border-teal-500/40 disabled:opacity-40 disabled:cursor-not-allowed transition-colors whitespace-nowrap">
                  + <span x-text="t('btnAddNote')"></span>
                </button>
              </form>

              <!-- Timeline Events List -->
              <div class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                <template x-if="!selectedItem.history || selectedItem.history.length === 0">
                  <div class="text-center py-4 text-slate-400 text-xs italic" x-text="t('historyEmpty')"></div>
                </template>

                <div class="relative pl-6 space-y-3 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-cyan-500/25">
                  <template x-for="(entry, index) in (selectedItem.history || [])" :key="entry.id || index">
                    <div class="relative text-[11px]">
                      <!-- Node Marker -->
                      <div class="absolute -left-6 top-0.5 w-5 h-5 rounded-full flex items-center justify-center text-[10px] border shadow"
                           :class="getHistoryDotClass(entry.type)">
                        <span x-text="getHistoryIcon(entry.type)"></span>
                      </div>

                      <!-- Card Content -->
                      <div class="bg-[#05131c]/90 border border-cyan-500/20 hover:border-teal-400/40 rounded-lg p-2.5 transition-colors">
                        <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
                          <span class="font-bold text-slate-100" x-text="getHistoryEventLabel(entry)"></span>
                          <span class="text-[10px] text-teal-300/70 font-mono" x-text="formatHistoryTime(entry.timestamp)"></span>
                        </div>

                        <!-- Value Transition -->
                        <template x-if="entry.from && entry.to && entry.from !== entry.to">
                          <div class="flex items-center gap-1.5 text-[11px] text-slate-300 flex-wrap my-1">
                            <span class="px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-400 font-medium"
                                  x-text="getHistoryValueDisplay(entry.field, entry.from)"></span>
                            <span class="text-teal-400 font-bold">➔</span>
                            <span :class="getHistoryValueClass(entry.field, entry.to)"
                                  class="font-bold"
                                  x-text="getHistoryValueDisplay(entry.field, entry.to)"></span>
                          </div>
                        </template>

                        <!-- Single Value (e.g. Created / Ingested) -->
                        <template x-if="!entry.from && entry.to && entry.type !== 'manual_note'">
                          <div class="my-1">
                            <span class="px-2 py-0.5 rounded font-medium bg-teal-950/70 border border-teal-500/30 text-teal-200"
                                  x-text="getHistoryValueDisplay(entry.field, entry.to)"></span>
                          </div>
                        </template>

                        <!-- Manual Note Content -->
                        <template x-if="entry.type === 'manual_note'">
                          <p class="text-teal-100 bg-[#071c28] p-2 rounded border border-teal-500/20 italic whitespace-pre-wrap my-1" x-text="entry.to || entry.note"></p>
                        </template>

                        <!-- Footer: Actor & Event ID -->
                        <div class="text-[10px] text-teal-300/50 mt-1 flex items-center justify-between">
                          <span><span x-text="t('historyActor')"></span>: <span class="text-teal-200/90 font-medium" x-text="entry.author || 'Operator'"></span></span>
                          <span class="text-[9px] font-mono text-teal-400/40" x-text="entry.id"></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-teal-200/70 font-medium" x-text="t('rawPayload')"></span>
                <button @click="copyToClip(JSON.stringify(selectedItem, null, 2), t('copyJson'))" class="text-teal-300 hover:text-white text-[10px] flex items-center gap-1">
                  <span>📋</span> <span x-text="t('copyJson')"></span>
                </button>
              </div>
              <pre class="bg-[#061822] p-2.5 rounded-xl font-mono text-[10px] text-teal-200 max-h-24 overflow-y-auto border border-cyan-500/20" x-text="JSON.stringify(selectedItem, null, 2)"></pre>
            </div>
          </div>
        </template>
      </div>

      <div class="flex justify-end pt-2 border-t border-cyan-500/20">
        <button @click="showInspectModal = false" class="px-4 py-2 bg-[#0c2433] hover:bg-[#113145] text-teal-200 rounded-xl text-xs font-semibold border border-cyan-500/30" x-text="t('close')"></button>
      </div>
    </div>
  </div>

          <span class="text-xl">🔑</span>
          <div>
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
              <span x-text="t('keyModalTitle')"></span>
            </h3>
            <span class="text-[10px] text-teal-300 font-mono font-semibold" x-text="t('modelBadge35')"></span>

                 class="w-full bg-[#071822] border border-cyan-500/30 rounded-xl pl-3 pr-10 py-2.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-teal-400 shadow-inner" />
          <button type="button" @click="showApiKeyText = !showApiKeyText"
                  class="absolute right-2.5 top-2.5 text-teal-300/70 hover:text-white text-xs p-1" title="Toggle visibility">

        <p class="text-[10px] text-teal-200/60 flex items-center gap-1.5">
          <svg class="w-3 h-3 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span x-text="t('keyModalNote')"></span>

      <!-- Gemini Model Version (3.5+ Supported) -->

          <label class="text-[11px] font-bold text-teal-200 block" x-text="t('modelSelectLabel')"></label>

        <div class="space-y-2">
          <!-- Option 1: gemini-3.8-flash (Recommended) -->
          <label class="flex items-start gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-colors"

            <input type="radio" name="gemini_model" value="gemini-3.8-flash" x-model="selectedModel" class="mt-1 text-teal-400 focus:ring-0" />
            <div class="text-xs flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-white">Gemini 3.8 Flash</span>
                <span class="text-[9px] bg-teal-400 text-slate-950 px-1.5 py-0.2 rounded font-extrabold" x-text="t('modelRecommended')"></span>

              <p class="text-[10px] text-teal-100/70 mt-0.5" x-text="t('modelDesc38')"></p>

          <label class="flex items-start gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-colors"

            <input type="radio" name="gemini_model" value="gemini-3.1-pro-preview" x-model="selectedModel" class="mt-1 text-teal-400 focus:ring-0" />
            <div class="text-xs flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-white">Gemini 3.1 Pro Preview</span>
                <span class="text-[9px] bg-purple-500/30 text-purple-200 border border-purple-500/40 px-1.5 py-0.2 rounded font-bold" x-text="t('modelDeep')"></span>
              </div>
              <p class="text-[10px] text-teal-100/70 mt-0.5" x-text="t('modelDesc31Pro')"></p>

          <label class="flex items-start gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-colors"
                 :class="selectedModel === 'gemini-3.1-flash-lite' ? 'bg-teal-950/70 border-teal-400/90 shadow-sm' : 'bg-[#061822]/60 border-cyan-500/20 hover:border-cyan-500/40'">
            <input type="radio" name="gemini_model" value="gemini-3.1-flash-lite" x-model="selectedModel" class="mt-1 text-teal-400 focus:ring-0" />
            <div class="text-xs flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-white">Gemini 3.1 Flash Lite</span>
                <span class="text-[9px] bg-cyan-500/30 text-cyan-200 border border-cyan-500/40 px-1.5 py-0.2 rounded font-bold" x-text="t('modelLite')"></span>
              </div>
              <p class="text-[10px] text-teal-100/70 mt-0.5" x-text="t('modelDesc31Lite')"></p>
            </div>
          </label>

          <!-- Option 4: Custom Model Name -->
          <label class="flex items-start gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-colors"
                 :class="selectedModel === 'custom' ? 'bg-teal-950/70 border-teal-400/90 shadow-sm' : 'bg-[#061822]/60 border-cyan-500/20 hover:border-cyan-500/40'">
            <input type="radio" name="gemini_model" value="custom" x-model="selectedModel" class="mt-1 text-teal-400 focus:ring-0" />

              <span class="font-bold text-white" x-text="t('modelCustomOption')"></span>

        <button type="button" @click="clearApiKey()" class="text-xs text-rose-400 hover:underline" x-text="t('keyModalRemove')"></button>
        <div class="flex gap-2">
          <button @click="showKeyModal = false" class="px-3.5 py-2 text-xs text-teal-200 hover:text-white" x-text="t('keyModalCancel')"></button>
          <button @click="saveApiKey()" class="twomi-button-primary px-5 py-2 text-xs rounded-xl font-bold shadow-md shadow-teal-500/20" x-text="t('keyModalSave')"></button>
        </div>
      </div>
    </div>
  </div>

    <div @click.outside="showUploadModal = false" class="twomi-card w-full max-w-lg rounded-2xl border border-cyan-500/35 p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-cyan-500/20 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">📁</span>
          <div>
            <h3 class="text-sm sm:text-base font-bold text-white" x-text="t('uploadModalTitle')"></h3>
            <span class="text-[10px] text-teal-300 font-mono font-semibold" x-text="t('uploadModalSubtitle')"></span>
          </div>
        </div>
        <button @click="showUploadModal = false" class="text-teal-300 hover:text-white p-1 rounded-lg hover:bg-white/10">✕</button>

      <div class="flex items-center justify-between gap-3 text-xs bg-[#071822] p-2.5 rounded-xl border border-cyan-500/25">
        <span class="text-teal-200/80 font-medium" x-text="t('importModeLabel') + ':'"></span>
        <div class="inline-flex rounded-lg bg-[#05131c] p-0.5 border border-cyan-500/30">
          <button type="button" @click="fileUploadMode = 'replace'"
                  :class="fileUploadMode === 'replace' ? 'bg-teal-500/30 text-teal-200 border-teal-400/50 font-bold' : 'text-slate-400 hover:text-slate-200 border-transparent'"
                  class="px-2.5 py-1 rounded text-xs border transition-all">
            <span x-text="t('importModeReplace')"></span>
          </button>
          <button type="button" @click="fileUploadMode = 'append'"
                  :class="fileUploadMode === 'append' ? 'bg-teal-500/30 text-teal-200 border-teal-400/50 font-bold' : 'text-slate-400 hover:text-slate-200 border-transparent'"
                  class="px-2.5 py-1 rounded text-xs border transition-all">
            <span x-text="t('importModeAppend')"></span>
          </button>

           @dragleave.prevent="activeDragOver = false"
           @drop.prevent="handleDrop($event); showUploadModal = false">
        
        <input type="file" id="twomi-modal-file-input" multiple accept=".csv,.json,.md,.markdown,.txt" class="hidden"

          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

          </svg>
        </div>

        <div>
          <p class="text-xs font-semibold text-slate-100" x-text="t('uploadDropzoneTitle')"></p>
          <p class="text-[11px] text-teal-200/60 mt-0.5" x-text="t('uploadDropzoneSubtitle')"></p>
        </div>

        <button type="button" onclick="document.getElementById('twomi-modal-file-input').click()"
                class="twomi-button-primary px-4 py-2 rounded-xl text-xs font-bold shadow-md shadow-teal-500/20">
          <span x-text="t('btnBrowseFiles')"></span>
        </button>

            📄 Sample CSV
          </button>
          <button @click="loadStarterFile('json'); showUploadModal = false"
                  class="p-2 rounded-lg bg-[#071822] hover:bg-[#0c2636] border border-cyan-500/30 text-cyan-200 text-left text-[11px] font-medium transition-colors">

          <button @click="loadStarterFile('md'); showUploadModal = false"
