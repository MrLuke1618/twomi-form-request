          <span x-text="t('btnOpenFullHub')"></span>
        </button>
        <button @click="showUploadModal = false" class="px-4 py-1.5 rounded-lg bg-[#0c2433] hover:bg-[#113145] text-slate-200" x-text="t('close')"></button>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL: FILE CONTENT PREVIEW ==================== -->
  <div x-show="showFilePreviewModal" class="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4">
    <div @click.outside="showFilePreviewModal = false" class="twomi-card w-full max-w-3xl rounded-2xl border border-cyan-500/35 p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-cyan-500/20 pb-3">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
          <span class="text-xl flex-shrink-0" x-text="previewingFile ? (previewingFile.type === 'csv' ? '📄' : (previewingFile.type === 'json' ? '🧩' : '📘')) : '📄'"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="text-sm sm:text-base font-bold text-white truncate" x-text="previewingFile ? previewingFile.name : ''"></h3>
              <span class="text-[10px] font-mono px-2 py-0.5 rounded-full uppercase font-bold"
                    :class="previewingFile && previewingFile.type === 'csv' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : (previewingFile && previewingFile.type === 'json' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30')"
                    x-text="previewingFile ? previewingFile.type : ''"></span>
            </div>
            <p class="text-[11px] text-teal-200/70 truncate mt-0.5" x-text="previewingFile ? previewingFile.summary : ''"></p>
          </div>
        </div>
        <button @click="showFilePreviewModal = false" class="text-teal-300 hover:text-white p-1 rounded-lg hover:bg-white/10">✕</button>
      </div>

      <!-- Preview Body -->
      <div class="space-y-3 text-xs max-h-[60vh] overflow-y-auto pr-1 font-mono">
        <template x-if="previewingFile">
          <div>
            <!-- Table Preview for CSV or JSON tickets -->
            <template x-if="previewingFile.type === 'csv' || (previewingFile.type === 'json' && previewingFile.parsedData && previewingFile.parsedData.items && previewingFile.parsedData.items.length > 0)">
              <div class="space-y-2">
                <div class="overflow-x-auto rounded-xl border border-cyan-500/25 bg-[#05131c]">
                  <table class="w-full text-left text-[11px]">
                    <thead>
                      <tr class="bg-[#081e2b] text-teal-200 font-semibold border-b border-cyan-500/20">
                        <th class="py-2 px-3">ID</th>
                        <th class="py-2 px-3" x-text="t('thSender')"></th>
                        <th class="py-2 px-3" x-text="t('thSubject')"></th>
                        <th class="py-2 px-3" x-text="t('thPriority')"></th>
                        <th class="py-2 px-3" x-text="t('thCategory')"></th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-cyan-500/10 text-slate-200">
                      <template x-for="item in (previewingFile.parsedData && previewingFile.parsedData.items ? previewingFile.parsedData.items.slice(0, 20) : (previewingFile.parsedData && previewingFile.parsedData.slice ? previewingFile.parsedData.slice(0, 20) : []))" :key="item.id">
                        <tr class="hover:bg-teal-500/5">
                          <td class="py-2 px-3 text-teal-300 font-mono text-[10px]" x-text="item.id"></td>
                          <td class="py-2 px-3 truncate max-w-[120px]" x-text="item.name || item.email || '—'"></td>
                          <td class="py-2 px-3 truncate max-w-[200px]" x-text="getItemSubject(item)"></td>
                          <td class="py-2 px-3">
                            <span :class="getPriorityClass(item.priority)" class="text-[10px] px-1.5 py-0.5 rounded border" x-text="getPriorityLabel(item.priority)"></span>
                          </td>
                          <td class="py-2 px-3 text-teal-200/80 text-[10px]" x-text="getCategoryLabel(item.category)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Raw text / Markdown / JSON tree -->
            <div class="mt-3">
              <span class="text-[10px] font-semibold text-teal-300/70 block mb-1" x-text="t('rawFileContent')"></span>
              <pre class="bg-[#05131c] p-3 rounded-xl border border-cyan-500/20 text-teal-100 text-[11px] whitespace-pre-wrap leading-relaxed max-h-72 overflow-y-auto" x-text="previewingFile.content"></pre>
            </div>
          </div>
        </template>
      </div>

      <!-- Preview Footer Actions -->
      <div class="flex items-center justify-between pt-2 border-t border-cyan-500/20 text-xs">
        <div class="flex items-center gap-2">
          <!-- Load to Queue Button -->
          <template x-if="previewingFile && (previewingFile.type === 'csv' || (previewingFile.type === 'json' && previewingFile.parsedData && previewingFile.parsedData.items))">
            <button @click="applyFileToQueue(previewingFile.id, fileUploadMode); showFilePreviewModal = false"
                    class="twomi-button-primary px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-teal-500/20">
              <span>⚡</span>
              <span x-text="t('btnApplyToQueue')"></span>
            </button>
          </template>
          <!-- Extract Tickets Button for MD -->
          <template x-if="previewingFile && previewingFile.type === 'md'">
            <button @click="extractTicketsFromMdFile(previewingFile.id); showFilePreviewModal = false"
                    class="twomi-button-primary px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-teal-500/20">
              <span>📝</span>
              <span x-text="t('btnExtractTicketsMd')"></span>
            </button>
          </template>
        </div>

        <button @click="showFilePreviewModal = false" class="px-4 py-2 rounded-xl bg-[#0c2433] hover:bg-[#113145] text-slate-200" x-text="t('close')"></button>
      </div>
    </div>
  </div>

  <!-- ==================== FLOATING ACTIONS: AUTO SCROLL TO TOP & TWOMI AI GUIDE ==================== -->
  <div class="fixed bottom-4 sm:bottom-6 right-4 sm:right-6 z-40 flex flex-col items-end gap-2.5 pointer-events-none">
    
    <!-- Auto scroll to the beginning button (Placed directly above the ChatBot button) -->
    <button @click="window.scrollTo({ top: 0, behavior: 'smooth' })" 
            x-show="showScrollTop" 
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-2 scale-90"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 translate-y-2 scale-90"
            class="pointer-events-auto p-2.5 sm:p-3 rounded-full bg-[#071924]/95 hover:bg-[#0c2a3d] border border-cyan-500/40 hover:border-teal-400 text-teal-300 hover:text-white shadow-xl hover:shadow-teal-500/25 transition-all text-xs flex items-center justify-center group"
            :title="t('scrollToTop')"
            :aria-label="t('scrollToTop')">
      <svg class="w-4 h-4 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>

    <!-- Collapsed Floating Launcher Button -->
    <button x-show="!chatOpen" @click="chatOpen = true" 
            class="pointer-events-auto twomi-button-primary px-4 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2.5 text-xs transition-transform hover:scale-105 active:scale-95 group border border-teal-300/40">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-200 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-teal-400"></span>
      </span>
      <svg class="w-4 h-4 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
      <span class="tracking-wide" x-text="t('chatBotTitle') || 'Twomi AI Guide'"></span>
    </button>

    <!-- Expanded Chat Window -->
    <div x-show="chatOpen" x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         class="pointer-events-auto w-[92vw] sm:w-[440px] max-w-[460px] twomi-card rounded-2xl shadow-2xl border border-cyan-500/40 flex flex-col overflow-hidden" 
         style="height: 520px; max-height: 85vh;">
      
      <!-- Chat Header -->
      <div class="bg-[#081e2b] px-4 py-3 border-b border-cyan-500/20 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-400 via-teal-300 to-emerald-400 flex items-center justify-center text-xs font-black text-slate-950 shadow-md">
            AI
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h4 class="text-xs font-bold text-white tracking-wide" x-text="t('chatBotTitle')">Twomi AI Guide</h4>
              <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-teal-500/20 text-teal-300 border border-teal-500/30" x-text="apiKey ? selectedModelShortLabel : 'Gemini 3.5+'"></span>
            </div>
            <span class="text-[10px] text-teal-300/90 flex items-center gap-1" x-text="t('chatBotSubtitle')">
              ● Live App Guide & Reviewer Assistant
            </span>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button @click="resetChat()" class="text-teal-300/70 hover:text-white text-xs p-1.5 rounded-lg hover:bg-white/5 transition-colors" title="Reset Conversation">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          <button @click="chatOpen = false" class="text-teal-300/70 hover:text-white text-xs p-1.5 rounded-lg hover:bg-white/5 transition-colors" title="Close">✕</button>
        </div>
      </div>

      <!-- Quick Requirement & Prompt Pills Carousel -->
      <div class="px-3 py-2 bg-[#06151f]/95 border-b border-cyan-500/20 flex gap-1.5 overflow-x-auto text-[10px] flex-shrink-0">
        <button @click="sendChatMsg(t('chatPresetRequirements'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          📋 <span x-text="t('chatPresetRequirements')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetSubmit'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          📝 <span x-text="t('chatPresetSubmit')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetQueue'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          ⚡ <span x-text="t('chatPresetQueue')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetHistory'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          ⏱️ <span x-text="t('chatPresetHistory')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetEdgeCases'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          ⚠️ <span x-text="t('chatPresetEdgeCases')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetStorage'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          💾 <span x-text="t('chatPresetStorage')"></span>
        </button>
        <button @click="sendChatMsg(t('chatPresetReviewer'))" class="whitespace-nowrap px-2.5 py-1 bg-[#0c2433] hover:bg-[#12364a] text-teal-200 hover:text-white rounded-lg border border-teal-500/20 hover:border-teal-400 transition-all font-medium">
          🔍 <span x-text="t('chatPresetReviewer')"></span>
        </button>
      </div>

      <!-- Messages Thread -->
      <div id="twomi-chat-thread" class="flex-1 p-3.5 overflow-y-auto space-y-3 text-xs scroll-smooth">
        <template x-for="(msg, idx) in chatMessages" :key="idx">
          <div :class="msg.sender === 'user' ? 'justify-end' : 'justify-start'" class="flex">
            <div :class="msg.sender === 'user' ? 'bg-teal-500/20 text-teal-100 border border-teal-400/40 rounded-2xl rounded-tr-sm' : 'bg-[#071822]/95 text-slate-200 border border-cyan-500/30 rounded-2xl rounded-tl-sm'"
                 class="max-w-[90%] p-3 text-xs leading-relaxed shadow-lg">
              
              <!-- Sender indicator for bot -->
              <template x-if="msg.sender === 'bot'">
                <div class="flex items-center gap-1.5 mb-1.5 pb-1 border-b border-cyan-500/20 text-[10px] text-teal-300 font-semibold">
                  <span x-text="'✨ ' + t('chatBotTitle')"></span>
                  <span class="text-slate-500 text-[9px]" x-text="msg.time"></span>
                </div>
              </template>

              <!-- Message Body with multiline formatting support -->
              <div class="space-y-1.5 whitespace-pre-line text-slate-200" x-html="formatChatMessage(msg.text)"></div>

              <!-- Interactive App Action Buttons -->
              <template x-if="msg.actions && msg.actions.length > 0">
                <div class="mt-2.5 pt-2 border-t border-cyan-500/20 flex flex-wrap gap-1.5">
                  <template x-for="(act, aIdx) in msg.actions" :key="aIdx">
                    <button @click="executeBotAction(act.action)"
                            class="px-2.5 py-1 bg-[#0d2a3a] hover:bg-teal-500/25 text-teal-300 hover:text-teal-100 rounded-lg text-[10px] font-bold border border-teal-500/30 hover:border-teal-400 transition-all shadow-sm flex items-center gap-1">
                      <span x-text="act.label"></span>
                    </button>
                  </template>
                </div>
              </template>

              <!-- Convert to Queue Ticket CTA -->
              <template x-if="msg.showTicketBtn">
                <div class="mt-2 pt-2 border-t border-cyan-500/20">
                  <button @click="createTicketFromChat(msg.ticketData); chatOpen = false;"
                          class="w-full py-1.5 text-[10px] font-bold twomi-button-primary rounded-lg flex items-center justify-center gap-1.5">
                    <span>📨</span> <span x-text="t('chatBtnConvertToTicket')"></span>
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Typing Indicator -->
        <template x-if="isChatTyping">
          <div class="flex justify-start">
            <div class="bg-[#071822] text-teal-300 border border-cyan-500/30 rounded-2xl rounded-tl-sm px-3.5 py-2 text-xs flex items-center gap-2">
              <span class="flex gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-bounce"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-bounce [animation-delay:0.4s]"></span>
              </span>
              <span class="text-[10px] text-teal-200/80" x-text="t('chatThinking')"></span>
            </div>
          </div>
        </template>
      </div>

      <!-- Footer Input Area -->
      <div class="p-2.5 bg-[#081e2b] border-t border-cyan-500/20 flex flex-col gap-1.5 flex-shrink-0">
        <div class="flex gap-2">
          <input type="text" x-model="chatUserMsg" @keydown.enter.prevent="sendChatMsg()" 
                 :placeholder="t('chatPlaceholder') || 'Ask how to use the app, submit forms, test edge cases...'"
                 class="flex-1 bg-[#06151f] border border-cyan-500/30 text-xs text-white placeholder:text-slate-500 rounded-xl px-3 py-2 focus:outline-none focus:border-teal-400" />
          <button @click="sendChatMsg()" :disabled="isChatTyping || !chatUserMsg.trim()" 
                  class="px-3.5 py-2 twomi-button-primary disabled:opacity-50 disabled:cursor-not-allowed rounded-xl text-xs font-bold flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
        <div class="flex items-center justify-between text-[9px] text-teal-200/50 px-1">
          <span x-text="t('chatSupportedLang')"></span>
          <span class="text-teal-300/80 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> <span x-text="t('chatConnectedState')"></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- OPERATIONAL INCIDENT & NOTIFICATION HUB -->
  <!-- Positioned strictly below the header (top-16 on mobile, top-20 on desktop) and aligned to the right.
       Container has pointer-events-none so it NEVER blocks clicks on background UI/UX elements.
       Individual cards have pointer-events-auto, instant dismiss, error codes, and operational SVGs. -->
  <div class="fixed top-16 sm:top-20 right-3 sm:right-6 z-50 pointer-events-none max-w-sm sm:max-w-md w-full flex flex-col gap-2.5">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto rounded-2xl p-3.5 border shadow-2xl backdrop-blur-xl transition-all duration-200"
           :class="getToastClasses(toast.type)">
        
        <div class="flex items-start justify-between gap-2.5">
          
          <!-- Operational Status Icon & Category Code -->
          <div class="flex items-start gap-2.5 flex-1 min-w-0">
            <div class="mt-0.5 p-1.5 rounded-xl flex-shrink-0" :class="getToastIconBadgeClasses(toast.type)">
              <template x-if="toast.type === 'error'">
                <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </template>
              <template x-if="toast.type === 'warning'">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </template>
              <template x-if="toast.type === 'success'">
                <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </template>
              <template x-if="toast.type === 'info'">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </template>
            </div>

            <div class="flex-1 min-w-0">
              <!-- Header with Operational Error Code -->
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded font-bold uppercase tracking-wider border"
                      :class="getToastCodeClasses(toast.type)"
                      x-text="toast.code"></span>
                <span class="text-[10px] text-slate-400 font-mono" x-text="toast.timestamp"></span>
              </div>
              
              <!-- Title -->
              <h5 class="text-xs font-bold text-white mt-1 leading-snug" x-text="toast.title"></h5>

              <!-- Detailed Message -->
              <p class="text-[11px] text-slate-300 mt-0.5 leading-relaxed break-words" x-text="toast.message"></p>

              <!-- Optional Technical Remediation Hint -->
              <template x-if="toast.hint">
                <div class="mt-1.5 pt-1.5 border-t border-white/10 flex items-center gap-1.5 text-[10px] text-teal-300/80 font-mono">
                  <span>▸</span>
                  <span x-text="toast.hint"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- Instant Dismiss Button -->
          <button @click="dismissToast(toast.id)" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors text-xs flex-shrink-0" title="Dismiss">
            ✕
          </button>
        </div>

      </div>
    </template>
  </div>

  <!-- Alpine.js Application Logic -->
  <script>
    function twomiApp() {
      return {
        activeTab: 'queue',
        currentLang: 'en',
        apiKey: '',
        apiKeyInput: '',
        selectedModel: 'gemini-3.8-flash',
        customModel: '',
        showApiKeyText: false,
        showSimpleGuide: true,
        showKeyModal: false,
        showInspectModal: false,
        selectedItem: null,
        showScrollTop: false,
        isAnalyzing: false,
        isAnalyzingSingle: false,
        searchQuery: '',
        filterCategory: 'ALL',
        filterStatus: 'ALL',
        filterPriority: 'ALL',
        sortBy: 'newest',
        filterOnlyFlagged: false,
        toasts: [],
        newTimelineNote: '',
        
        // Dynamic Files & Ingestion State (CSV, JSON, MD)
        uploadedFiles: [],
        fileUploadMode: 'replace',
        fileAutoTriage: true,
        showUploadModal: false,
        showFilePreviewModal: false,
        previewingFile: null,
        rawPasteText: '',
        rawPasteFormat: 'csv',
        activeDragOver: false,
        isUploading: false,

        get activeContextFilesCount() {
          return (this.uploadedFiles || []).filter(f => f.isActive).length;
        },

        get activeFilesSummary() {
          const active = (this.uploadedFiles || []).filter(f => f.isActive);
          if (active.length === 0) return this.t('noFilesUploaded');
          return active.map(f => f.name).join(', ');
        },
        
        toggleSimpleGuide() {
          this.showSimpleGuide = !this.showSimpleGuide;

          this.loadDefaultData();

        recalculateEdgeCases() {
          const seen = new Map();
          this.queue.forEach(item => {
            const hasName = !!(item.name && item.name.trim().length > 1);
            const hasEmail = this.isValidEmail(item.email);
            const hasMsg = !!(item.message && item.message.trim().length >= 15);
            item.isIncomplete = !hasName || !hasEmail || !hasMsg;

            const hash = `${(item.email || '').toLowerCase().trim()}:::${(item.subject || '').toLowerCase().trim()}:::${(item.message || '').slice(0, 40).toLowerCase().trim()}`;
            if (seen.has(hash)) {
              item.isDuplicate = true;
            } else {
              seen.set(hash, item.id);
              item.isDuplicate = false;
            }
          });
        },

          return e ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim()) : false;

            }

            if (this.filterStatus !== 'ALL' && item.status !== this.filterStatus) return false;
            if (this.filterPriority !== 'ALL' && (item.priority || 'Normal') !== this.filterPriority) return false;
            if (this.filterOnlyFlagged && !item.isIncomplete && !item.isDuplicate) return false;
            return true;
          });

          if (this.sortBy === 'newest') {
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          } else if (this.sortBy === 'oldest') {
            list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          } else if (this.sortBy === 'priority_desc') {
            list.sort((a, b) => this.getPriorityWeight(b.priority) - this.getPriorityWeight(a.priority) || (b.timestamp || 0) - (a.timestamp || 0));
          } else if (this.sortBy === 'priority_asc') {
            list.sort((a, b) => this.getPriorityWeight(a.priority) - this.getPriorityWeight(b.priority) || (b.timestamp || 0) - (a.timestamp || 0));
          }
          return list;
        },

          };

        ensureItemHistory(item) {
          if (!item) return;
          if (!Array.isArray(item.history) || item.history.length === 0) {
            item.history = [
              {
                id: 'h-' + Math.random().toString(36).substring(2, 9),
                timestamp: item.timestamp || Date.now(),
                type: 'created',
                field: 'created',
                from: null,
                to: item.source || 'Jump-In Stream',
                author: item.source === 'Contact Form' ? 'Ingestion Gateway' : (item.source === 'Simulated Email' ? 'Mail Server' : 'Stream Gateway')
              }
            ];
          }
          if (!item._shadow) {
            item._shadow = {
              priority: item.priority || 'Normal',
              status: item.status || 'Pending',
              category: item.category || 'General Inquiry',
              assignee: item.assignee || 'Unassigned'
            };
          }
        },

        recordFieldChange(item, field, newVal, author = 'Operator') {
          if (!item) return;
          this.ensureItemHistory(item);
          const oldVal = item[field];
          
          if (newVal !== undefined && newVal !== null) {
            if (oldVal === newVal) return;
            item[field] = newVal;
          } else {
            const shadowVal = item._shadow?.[field];
            if (shadowVal === item[field]) return;
            newVal = item[field];
          }

          if (item._shadow) item._shadow[field] = item[field];

          let type = 'status_change';
          if (field === 'priority') type = 'priority_change';
          else if (field === 'category') type = 'category_change';
          else if (field === 'assignee') type = 'assignee_change';
          else if (field === 'status') type = 'status_change';

          const entry = {
            id: 'h-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6),
            timestamp: Date.now(),
            type: type,
            field: field,
            from: oldVal || '—',
            to: item[field],
            author: author || 'Operator'
          };

          item.history.unshift(entry);
          this.saveToStorage();
          this.showOpInfo('OP_TICKET_HIST_AUDIT', this.t('ticketUpdated'), `${item.id}: ${this.getHistoryEventLabel(entry)}`, 'AUDIT_TRAIL');
        },

        addTicketNote(item) {

            timestamp: Date.now(),
            type: 'manual_note',
            field: 'note',

          if (field === 'status') return this.getStatusClass(val) + ' border px-2 py-0.5 rounded';

        formatHistoryTime(ts) {
          if (!ts) return this.t('timeJustNow');

          const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ', ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
          
          if (diffSec < 60) return `${this.t('timeJustNow')} (${timeStr})`;
          const mins = Math.floor(diffSec / 60);

          const hours = Math.floor(mins / 60);
          if (hours < 24) return `${hours}${this.t('timeAgoHours')} • ${timeStr}`;

          return `${days}${this.t('timeAgoDays')} • ${timeStr}`;

        submitContact() {
          const name = (this.contactForm.name || '').trim();
          const email = (this.contactForm.email || '').trim();
          const subject = (this.contactForm.subject || '').trim();
          const message = (this.contactForm.message || '').trim();
          const category = this.contactForm.category;
          const priority = this.contactForm.priority;

          // Schema validation
          const valErrors = [];
          if (!name || name.length < 2) valErrors.push('name (min 2 chars)');
          if (!this.isValidEmail(email)) valErrors.push('email (RFC 5322 standard required)');
          if (!subject || subject.length < 4) valErrors.push('subject (min 4 chars)');
          if (!message || message.length < 8) valErrors.push('message (min 8 chars)');

          if (valErrors.length > 0) {
            this.showOpError(
              'ERR_VAL_SCHEMA_REJECTED',
              this.t('errValTitle'),
              `${this.t('errValDesc')}: [${valErrors.join(', ')}]`,
              'INGESTION_GATEWAY • HTTP 422 UNPROCESSABLE_ENTITY'
            );
            return;
          }

          // Duplicate collision detection
          const hash = `${email.toLowerCase()}:::${subject.toLowerCase()}:::${message.slice(0, 40).toLowerCase()}`;
          let collidingItem = null;
          for (const item of this.queue) {
            const itemHash = `${(item.email || '').toLowerCase().trim()}:::${(item.subject || '').toLowerCase().trim()}:::${(item.message || '').slice(0, 40).toLowerCase().trim()}`;
            if (itemHash === hash) {
              collidingItem = item;
              break;
            }
          }

          const newId = 'TWM-' + Math.floor(1000 + Math.random() * 9000);
          const newItem = {
            id: newId,
            source: 'Contact Form',
            name,
            email,
            category,
            priority,
            subject,
            message,
            status: collidingItem ? 'Incomplete/Duplicate' : 'Pending',
            assignee: 'Unassigned',
            timestamp: Date.now(),
            vipStatus: false,
            isIncomplete: false,
            isDuplicate: !!collidingItem,
            sentiment: priority === 'Urgent' ? 'Urgent' : 'Neutral',
            aiIntent: 'Contact Form Request',
            aiSuggestedReply: '',
            history: [
              ...(collidingItem ? [{
                id: 'h-' + Date.now().toString(36) + '-2',
                timestamp: Date.now(),
                type: 'status_change',
                field: 'status',
                from: 'Pending',
                to: 'Incomplete/Duplicate',
                author: 'Idempotency Filter (Collision #' + collidingItem.id + ')'
              }] : []),
              {
                id: 'h-' + Date.now().toString(36) + '-1',
                timestamp: Date.now() - (collidingItem ? 1000 : 0),
                type: 'created',
                field: 'created',
                from: null,
                to: 'Contact Form',
                author: 'Ingestion Gateway'
              }
            ]
          };

          this.queue.unshift(newItem);
          this.recalculateEdgeCases();
          this.saveToStorage();
          this.contactForm = { name: '', email: '', category: 'Jump In Streaming', priority: 'Normal', subject: '', message: '' };

          if (collidingItem) {
            this.showOpWarning(
              'ERR_IDEMP_COLLISION',
              this.t('errDuplicateTitle'),
              `${this.t('errDuplicateDesc')} #${collidingItem.id}. ${this.t('errDuplicateAction')}`,
              'IDEMPOTENCY_FILTER • SHA256_COLLISION'
            );
          } else {
            this.showOpSuccess(
              'OP_TICKET_DISPATCHED',
              this.t('opTicketCreated'),
              `Ticket #${newId} successfully ingested and routed to live operations queue.`,
              'DISPATCH_SERVICE • HTTP 201 CREATED'
            );
          }
          this.activeTab = 'queue';
        },

        ingestEmail() {
          const raw = this.rawEmail || '';
          let fromName = '', fromEmail = '', subject = '', bodyLines = [];
          let inHeaders = true;

          for (const line of raw.split('\n')) {
            if (inHeaders && line.trim() === '') { inHeaders = false; continue; }
            if (inHeaders) {
              const mFrom = line.match(/^From:\s*(?:"([^"]*)"\s*)?<?([^>]+@[^>]+)>?/i);
              if (mFrom) { fromName = mFrom[1] || mFrom[2].split('@')[0]; fromEmail = mFrom[2]; continue; }
              const mSubj = line.match(/^Subject:\s*(.+)$/i);
              if (mSubj) { subject = mSubj[1].trim(); continue; }
            } else {
              bodyLines.push(line);
            }
          }

          const body = bodyLines.join('\n').trim() || raw;
          const isMimeMalformed = !fromEmail || !this.isValidEmail(fromEmail) || !subject;
          const newId = 'TWM-' + Math.floor(1000 + Math.random() * 9000);

          // Check duplicate
          const hash = `${(fromEmail || '').toLowerCase()}:::${(subject || '').toLowerCase()}:::${body.slice(0, 40).toLowerCase()}`;
          let isDup = false;
          let dupId = null;
          for (const item of this.queue) {
            const itemHash = `${(item.email || '').toLowerCase().trim()}:::${(item.subject || '').toLowerCase().trim()}:::${(item.message || '').slice(0, 40).toLowerCase().trim()}`;
            if (itemHash === hash) {
              isDup = true;
              dupId = item.id;
              break;
            }
          }

          this.queue.unshift({
            id: newId,
            source: 'Simulated Email',
            name: fromName || '',
            email: fromEmail || 'unparsed-sender@stream',
            subject: subject || '(Missing Subject)',
            message: body || '(Empty Payload)',
            category: 'General Inquiry',
            priority: (isMimeMalformed || isDup) ? 'Urgent' : 'Normal',
            status: (isMimeMalformed || isDup) ? 'Incomplete/Duplicate' : 'Pending',
            assignee: 'Unassigned',
            timestamp: Date.now(),
            vipStatus: false,
            isIncomplete: isMimeMalformed,
            isDuplicate: isDup,
            sentiment: 'Neutral',
            aiIntent: 'Inbound Email',
            aiSuggestedReply: '',
            history: [
              ...((isMimeMalformed || isDup) ? [{
                id: 'h-' + Date.now().toString(36) + '-2',
                timestamp: Date.now(),
                type: 'status_change',
                field: 'status',
                from: 'Pending',
                to: 'Incomplete/Duplicate',
                author: isMimeMalformed ? 'RFC Parser (Malformed Flagged)' : ('Idempotency Filter (Collision #' + dupId + ')')
              }] : []),
              {
                id: 'h-' + Date.now().toString(36) + '-1',
                timestamp: Date.now() - ((isMimeMalformed || isDup) ? 1000 : 0),
                type: 'created',
                field: 'created',
                from: null,

                author: isMimeMalformed ? 'Mail Ingestion (Header Error)' : 'Stream Mail Gateway'
              }
            ]
          });

              this.t('errMimeDesc'),
              'STREAM_INGESTION • RFC_2822_SYNTAX_ERROR'
            );
          } else if (isDup) {

              `${this.t('errDuplicateDesc')} #${dupId}. ${this.t('errDuplicateAction')}`,

            );

        runLocalHeuristic(item) {
          const txt = ((item.subject || '') + ' ' + (item.message || '')).toLowerCase();

            item.category = 'Jump In Streaming';

            item.sentiment = txt.includes('urgent') || txt.includes('broke') ? 'Urgent' : 'Neutral';
            item.aiSuggestedReply = `Hello ${item.name || 'there'}, our live streaming team checked our WebRTC stream cluster. Please verify if disabling low-latency audio sync resolves the jitter.`;

            item.category = 'Avatar Tech & Rigging';
            item.aiIntent = '3D Avatar Glitch';
            item.sentiment = 'Neutral';
            item.aiSuggestedReply = `Hi ${item.name || 'Creator'}, please re-upload your avatar via the Twomi Model Validator to ensure all bone constraints match the 1.0 schema.`;
          } else if (txt.includes('payout') || txt.includes('revenue') || txt.includes('split') || txt.includes('gift')) {
            item.category = 'Creator Studio & Payouts';
            item.aiIntent = 'Creator Monetization Query';
            item.sentiment = 'Positive';
            item.aiSuggestedReply = `Hi ${item.name || 'Partner'}, our creator payout cycle executes twice monthly on the 1st and 15th via Stripe or wire transfers.`;
          } else if (item.isIncomplete) {
            item.aiIntent = 'Incomplete Inquiry';
            item.sentiment = 'Frustrated';
            item.aiSuggestedReply = `Hello, your request appears to be missing key account credentials. Please reply directly with your registered Twomi email.`;
          } else {
            item.aiIntent = 'General Support Inquiry';
            item.sentiment = 'Neutral';
            item.aiSuggestedReply = `Hello ${item.name || 'there'}, thank you for contacting Twomi. An operations specialist has been notified and will reply shortly.`;

        async runAIBatchCategorize() {
          this.isAnalyzing = true;
          this.showOpInfo('OP_BATCH_START', 'AI Triage Initiated', `Processing ${this.queue.length} tickets across avatar and stream categories...`, 'BATCH_ORCHESTRATOR');
          for (const item of this.queue) {

        async callGemini(item) {
          if (!this.apiKey) {
            this.showOpInfo(
              'WARN_LOCAL_HEURISTICS',
              this.t('noticeLocalAiTitle'),
              this.t('noticeLocalAiDesc'),
              'EDGE_HEURISTICS • REGEX_INTENT'
            );
            this.runLocalHeuristic(item);
            return;
          }

          const modelToUse = this.getActiveModelIdentifier();

          try {
            const dynamicContext = this.getDynamicContextPrompt();
            let prompt = `You are lead Operations AI for Twomi request management platform.`;
            if (dynamicContext) {
              prompt += `\n\n--- DYNAMIC CONTEXT & OPERATIONAL GUIDELINES (FROM UPLOADED CSV/JSON/MD FILES) ---\n${dynamicContext}\n---------------------------------------------------------------------------------\nNOTE: You MUST adapt your category selection, priority rating, intent identification, and suggestedReply to follow any rules, policies, or domain knowledge in the uploaded files above!`;
            }
            prompt += `\nReturn strict JSON with:
- category ("Avatar Tech & Rigging", "Jump In Streaming", "Creator Studio & Payouts", "Account & VIP Access", "Audio / Latency Sync", "General Inquiry")
- sentiment ("Positive", "Neutral", "Frustrated", "Urgent")
- intent (short phrase, e.g. "Avatar Motion Bug")
- suggestedReply (polite 2-sentence operator response referencing policies or context when applicable)

Sender: ${item.name || 'User'} (${item.email || 'None'})
Subject: ${item.subject || ''}
Message: ${item.message || ''}`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${this.apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });

            if (res.status === 400 || res.status === 401 || res.status === 403) {
              this.showOpError(
                'ERR_AI_AUTH_FAILED',
                this.t('errAiAuthTitle'),
                `HTTP ${res.status}: Gemini API key invalid or unauthorized for ${modelToUse}. Switched to Local Heuristics engine.`,
                'GEMINI_BYOK_SERVICE • HTTP_' + res.status
              );
              this.runLocalHeuristic(item);
              return;
            }

            if (res.status === 429) {
              this.showOpWarning(
                'ERR_AI_RATE_LIMIT',
                this.t('errAiQuotaTitle'),
                `HTTP 429: Gemini API rate limit reached for ${modelToUse}. Switched to Local Heuristics engine.`,
                'GEMINI_QUOTA_MANAGER • HTTP_429'
              );
              this.runLocalHeuristic(item);
              return;
            }

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const p = JSON.parse(text);
              if (p.category) item.category = p.category;
              if (p.sentiment) item.sentiment = p.sentiment;
              if (p.intent) item.aiIntent = p.intent;
              if (p.suggestedReply) item.aiSuggestedReply = p.suggestedReply;
            }
          } catch(err) {
            this.showOpError(
              'ERR_AI_TRANSPORT_TIMEOUT',
              'AI Gateway Transport Failure',
              err.message || 'Network disconnected or fetch blocked. Running local heuristic engine.',
              'RPC_NETWORK_TRANSPORT'
            );
            this.runLocalHeuristic(item);
          }
        },

        exportData(fmt) {
          let content = '', filename = `twomi_queue_${new Date().toISOString().slice(0,10)}`, mime = 'text/plain';
          if (fmt === 'json') {
            content = JSON.stringify(this.queue, null, 2);
            filename += '.json'; mime = 'application/json';
          } else if (fmt === 'csv') {
            filename += '.csv'; mime = 'text/csv';
            const h = ['ID','Source','Priority','Name','Email','Subject','Category','Status','Assignee','Duplicate','Incomplete'];
            const rows = this.queue.map(i => [
              `"${i.id}"`,`"${i.source}"`,`"${i.priority || 'Normal'}"`,`"${(i.name||'').replace(/"/g,'""')}"`,`"${(i.email||'').replace(/"/g,'""')}"`,
              `"${(i.subject||'').replace(/"/g,'""')}"`,`"${i.category}"`,`"${i.status}"`,`"${i.assignee}"`,
              i.isDuplicate?'YES':'NO',i.isIncomplete?'YES':'NO'
            ].join(','));
            content = [h.join(','), ...rows].join('\n');
          } else if (fmt === 'md') {
            filename += '.md';
            content = `# Twomi Operations Queue Report\nGenerated: ${new Date().toUTCString()}\n\n| ID | Source | Priority | Sender | Subject | Category | Status |\n|---|---|---|---|---|---|---|\n` +
              this.queue.map(i => `| ${i.id} | ${i.source} | ${i.priority || 'Normal'} | ${i.name || 'Anonymous'} | ${i.subject} | ${i.category} | ${i.status} |`).join('\n');
          }
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
          this.showOpSuccess('OP_DATA_EXPORTED', 'Queue File Exported', `Generated and downloaded ${filename}`, 'IO_EXPORTER');
        },

        formatFileSize(bytes) {
          if (!bytes || bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        },

        parseCSV(text, filename = 'data.csv') {
          const lines = [];
          let row = [];
          let inQuotes = false;
          let currentField = '';
          const cleanText = text.replace(/^\uFEFF/, '');

          for (let i = 0; i < cleanText.length; i++) {
            const char = cleanText[i];
            const nextChar = cleanText[i + 1];

            if (char === '"') {
              if (inQuotes && nextChar === '"') {
                currentField += '"';
                i++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === ',' && !inQuotes) {
              row.push(currentField.trim());
              currentField = '';
            } else if ((char === '\r' || char === '\n') && !inQuotes) {
              if (char === '\r' && nextChar === '\n') i++;
              row.push(currentField.trim());
              if (row.some(f => f.length > 0)) lines.push(row);
              row = [];
              currentField = '';
            } else {
              currentField += char;
            }
          }
          if (currentField.length > 0 || row.length > 0) {
            row.push(currentField.trim());
            if (row.some(f => f.length > 0)) lines.push(row);
          }

          if (lines.length < 2) throw new Error('CSV must contain at least a header row and 1 data row.');

          const rawHeaders = lines[0].map(h => h.toLowerCase().replace(/[^a-z0-9_]/g, '_'));
          const findCol = (possible) => {
            for (const p of possible) {
              const idx = rawHeaders.findIndex(h => h.includes(p));
              if (idx !== -1) return idx;
            }
            return -1;
          };

          const idCol = findCol(['id', 'ticket', 'issue_num', 'ref', 'key']);
          const nameCol = findCol(['name', 'sender', 'customer', 'user', 'author', 'from']);
          const emailCol = findCol(['email', 'mail', 'sender_email', 'contact']);
          const subjCol = findCol(['subject', 'title', 'issue', 'summary', 'topic', 'headline']);
          const msgCol = findCol(['message', 'description', 'content', 'body', 'detail', 'text', 'inquiry']);
          const catCol = findCol(['category', 'type', 'dept', 'department', 'tag', 'topic']);
          const prioCol = findCol(['priority', 'urgency', 'severity', 'level']);
          const statusCol = findCol(['status', 'state']);
          const assigneeCol = findCol(['assignee', 'agent', 'assigned_to', 'owner', 'staff']);
          const sourceCol = findCol(['source', 'channel', 'origin', 'platform']);

          const items = [];
          for (let r = 1; r < lines.length; r++) {
            const row = lines[r];
            if (row.length === 0 || row.every(c => !c)) continue;

            const subject = (subjCol !== -1 && row[subjCol]) ? row[subjCol] : (row[0] || 'Imported Request');
            const message = (msgCol !== -1 && row[msgCol]) ? row[msgCol] : (row.slice(1).filter(Boolean).join(' ') || subject);
            const name = (nameCol !== -1 && row[nameCol]) ? row[nameCol] : '';
            const email = (emailCol !== -1 && row[emailCol]) ? row[emailCol] : '';

            const rawPrio = (prioCol !== -1 && row[prioCol]) ? row[prioCol].toLowerCase() : 'normal';
            let priority = 'Normal';
            if (rawPrio.includes('urg') || rawPrio.includes('crit') || rawPrio.includes('p1')) priority = 'Urgent';
            else if (rawPrio.includes('high') || rawPrio.includes('p2')) priority = 'High';
            else if (rawPrio.includes('low') || rawPrio.includes('p4')) priority = 'Low';

            const rawStatus = (statusCol !== -1 && row[statusCol]) ? row[statusCol].toLowerCase() : 'pending';
            let status = 'Pending';
            if (rawStatus.includes('prog') || rawStatus.includes('open')) status = 'In Progress';
            else if (rawStatus.includes('resolv') || rawStatus.includes('close') || rawStatus.includes('done')) status = 'Resolved';
            else if (rawStatus.includes('dup') || rawStatus.includes('incomp') || rawStatus.includes('flag')) status = 'Incomplete/Duplicate';

            const source = (sourceCol !== -1 && row[sourceCol]) ? row[sourceCol] : `CSV (${filename})`;
            const category = (catCol !== -1 && row[catCol]) ? row[catCol] : 'General Inquiry';
            const assignee = (assigneeCol !== -1 && row[assigneeCol]) ? row[assigneeCol] : 'Unassigned';
            const id = (idCol !== -1 && row[idCol]) ? row[idCol] : ('CSV-' + (1000 + items.length + 1));

            items.push({
              id: String(id).startsWith('TWM-') || String(id).startsWith('CSV-') ? String(id) : 'CSV-' + id,
              source,
              name,
              email,
              subject,
              message,
              category,
              priority,
              status,
              assignee,
              timestamp: Date.now() - (items.length * 3600000),
              vipStatus: false,
              isIncomplete: false,
              isDuplicate: false,
              sentiment: 'Neutral',
              aiIntent: 'Imported CSV Request',
              aiSuggestedReply: '',
              history: [
                {
                  id: 'h-' + Date.now().toString(36) + '-' + items.length,
                  timestamp: Date.now(),
                  type: 'created',
                  field: 'created',
                  from: null,
                  to: source,
                  author: 'CSV Dynamic Parser'
                }
              ]
            });
          }

          return {
            items,
            headers: lines[0],
            rowCount: items.length
          };
        },

        parseJSON(text, filename = 'data.json') {
          let parsed;
          try {
            parsed = JSON.parse(text);
          } catch(e) {
            throw new Error('Invalid JSON format: ' + e.message);
          }

          let rawList = null;
          let isContextDoc = false;

          if (Array.isArray(parsed)) {
            rawList = parsed;
          } else if (typeof parsed === 'object' && parsed !== null) {
            if (Array.isArray(parsed.tickets)) rawList = parsed.tickets;
            else if (Array.isArray(parsed.items)) rawList = parsed.items;
            else if (Array.isArray(parsed.requests)) rawList = parsed.requests;
            else if (Array.isArray(parsed.data)) rawList = parsed.data;
            else if (Array.isArray(parsed.inquiries)) rawList = parsed.inquiries;
            else {
              isContextDoc = true;
            }
          }

          if (isContextDoc || !rawList || rawList.length === 0) {
            return {
              type: 'context',
              data: parsed,
              items: [],
              summary: typeof parsed === 'object' ? Object.keys(parsed).slice(0, 5).join(', ') + ' fields' : 'Structured JSON Context'
            };
          }

          const items = rawList.map((obj, idx) => {
            const id = obj.id || obj.ticket_id || ('JSON-' + (1000 + idx + 1));
            const subject = obj.subject || obj.title || obj.summary || obj.headline || 'Imported JSON Item';
            const message = obj.message || obj.description || obj.content || obj.body || obj.details || subject;
            const name = obj.name || obj.sender || obj.customer || obj.user || '';
            const email = obj.email || obj.sender_email || obj.mail || '';
            const source = obj.source || obj.channel || `JSON (${filename})`;
            const category = obj.category || obj.type || 'General Inquiry';
            let priority = obj.priority || 'Normal';
            if (!['Urgent', 'High', 'Normal', 'Low'].includes(priority)) priority = 'Normal';
            let status = obj.status || 'Pending';
            if (!['Pending', 'In Progress', 'Resolved', 'Incomplete/Duplicate'].includes(status)) status = 'Pending';
            const assignee = obj.assignee || obj.agent || 'Unassigned';

            return {
              id: String(id).startsWith('TWM-') || String(id).startsWith('JSON-') ? String(id) : 'JSON-' + id,
              source,
              name,
              email,
              subject,
              message,
              category,
              priority,
              status,
              assignee,
              timestamp: obj.timestamp ? Number(obj.timestamp) : Date.now() - (idx * 1800000),
              vipStatus: !!obj.vipStatus,
              isIncomplete: false,
              isDuplicate: false,
              sentiment: obj.sentiment || 'Neutral',
              aiIntent: obj.intent || obj.aiIntent || 'Imported JSON Item',
              aiSuggestedReply: obj.aiSuggestedReply || obj.reply || '',
              history: [
                {
                  id: 'h-' + Date.now().toString(36) + '-' + idx,
                  timestamp: Date.now(),
                  type: 'created',
                  field: 'created',
                  from: null,
                  to: source,
                  author: 'JSON Dynamic Parser'
                }
              ]
            };
          });

          return {
            type: 'tickets',
            data: parsed,
            items,
            summary: `${items.length} records parsed from JSON`
          };
        },

        parseMarkdown(text, filename = 'document.md') {
          const lines = text.split('\n');
          const sections = [];
          const actionItems = [];
          let currentSection = { title: 'Overview', lines: [] };

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('#')) {
              if (currentSection.lines.length > 0) sections.push({ ...currentSection });
              currentSection = { title: trimmed.replace(/^#+\s*/, ''), lines: [] };
            } else if (trimmed.startsWith('- [ ]') || trimmed.startsWith('* [ ]') || trimmed.match(/^(?:issue|ticket|bug|task|request)\s*#?\d*[:\-]/i)) {
              currentSection.lines.push(trimmed);
              const cleanMsg = trimmed.replace(/^[\-\*]\s*\[\s*\]\s*/, '');
              actionItems.push(cleanMsg);
            } else if (trimmed) {
              currentSection.lines.push(trimmed);
            }
          }
          if (currentSection.lines.length > 0) sections.push(currentSection);

          const items = actionItems.map((msg, idx) => ({
            id: 'MD-' + (1000 + idx + 1),
            source: `Markdown (${filename})`,
            name: 'Document Action Item',
            email: 'policy-bot@twomi.live',
            subject: msg.length > 55 ? msg.slice(0, 55) + '...' : msg,
            message: msg,
            category: 'General Inquiry',
            priority: msg.toLowerCase().includes('urgent') || msg.toLowerCase().includes('critical') ? 'Urgent' : 'Normal',
            status: 'Pending',
            assignee: 'Unassigned',
            timestamp: Date.now() - (idx * 3600000),
            vipStatus: false,
            isIncomplete: false,
            isDuplicate: false,
            sentiment: 'Neutral',
            aiIntent: 'Extracted from Markdown',
            aiSuggestedReply: '',
            history: [
              {
                id: 'h-' + Date.now().toString(36) + '-' + idx,
                timestamp: Date.now(),
                type: 'created',
                field: 'created',
                from: null,
                to: `Markdown (${filename})`,
                author: 'Markdown Ticket Extractor'
              }
            ]
          }));

          const headings = sections.map(s => s.title).filter(t => t !== 'Overview').slice(0, 4).join(', ');
          const summary = headings ? `SOP Sections: ${headings}` : `${sections.length} sections, ${lines.length} lines of operational rules`;

          return {
            sections,
            actionItems,
            items,
            summary
          };
        },

        getDynamicContextPrompt() {
          const active = (this.uploadedFiles || []).filter(f => f.isActive);
          if (active.length === 0) return '';

          let prompt = '';
          for (const f of active) {
            prompt += `\n[DOCUMENT / CONTEXT: "${f.name}" (${f.type.toUpperCase()})]\n`;
            if (f.type === 'md') {
              prompt += f.content.slice(0, 3200) + (f.content.length > 3200 ? '\n... (truncated for context token limits)' : '');
            } else if (f.type === 'json') {
              if (f.parsedData && f.parsedData.type === 'context') {
                prompt += JSON.stringify(f.parsedData.data, null, 2).slice(0, 3000);
              } else {
                prompt += `Loaded dataset containing ${f.recordCount || 0} tickets/records. Sample: ` + f.summary;
              }
            } else if (f.type === 'csv') {
              prompt += `Tabular customer request dataset with ${f.recordCount || 0} rows. Sample summary: ` + f.summary;
            }
            prompt += '\n';
          }
          return prompt.trim();
        },

        async handleFileUpload(fileList, mode = null, autoTriage = null) {
          if (!fileList || fileList.length === 0) return;
          const importMode = mode || this.fileUploadMode || 'replace';
          const shouldTriage = autoTriage !== null ? autoTriage : this.fileAutoTriage;

          this.isUploading = true;
          let totalImportedTickets = 0;

          for (let i = 0; i < fileList.length; i++) {
            const file = fileList[i];
            const name = file.name;
            const ext = name.split('.').pop().toLowerCase();
            const text = await file.text();

            try {
              const res = this.processFile(name, ext, text, importMode);
              if (res && res.ticketCount) totalImportedTickets += res.ticketCount;
            } catch(err) {
              this.showOpError('ERR_FILE_PARSE', `Failed to parse ${name}`, err.message || 'File syntax error', 'FILE_INGESTION');
            }
          }

          this.isUploading = false;
          this.recalculateEdgeCases();
          this.saveToStorage();

          if (shouldTriage && totalImportedTickets > 0) {
            this.showOpInfo('OP_AUTO_TRIAGE', 'Auto-Triage Triggered', `Running triage on ${totalImportedTickets} imported tickets...`, 'BATCH_ORCHESTRATOR');
            this.runAIBatchCategorize();
          }
        },

        handleDrop(e) {
          this.activeDragOver = false;
          const dt = e.dataTransfer;
          if (dt && dt.files && dt.files.length > 0) {

        processFile(name, ext, text, importMode) {
          let type = 'csv';
          if (ext === 'json') type = 'json';
          else if (ext === 'md' || ext === 'markdown') type = 'md';
          else if (ext === 'txt') type = text.trim().startsWith('{') || text.trim().startsWith('[') ? 'json' : (text.includes(',') ? 'csv' : 'md');

          const fileId = 'file-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
          let parsedData = null;
          let summary = '';
          let recordCount = 0;
          let newTickets = [];

          if (type === 'csv') {
            const parsed = this.parseCSV(text, name);
            parsedData = parsed;
            recordCount = parsed.items.length;
            summary = `Parsed ${recordCount} tabular requests with columns: ${(parsed.headers || []).slice(0, 5).join(', ')}`;
            newTickets = parsed.items;
          } else if (type === 'json') {
            const parsed = this.parseJSON(text, name);
            parsedData = parsed;
            if (parsed.type === 'tickets') {
              recordCount = parsed.items.length;
              summary = parsed.summary;
              newTickets = parsed.items;
            } else {
              summary = `Structured knowledge JSON context with ${Object.keys(parsed.data || {}).length} root keys`;
            }
          } else {
            const parsed = this.parseMarkdown(text, name);
            parsedData = parsed;
            recordCount = parsed.actionItems ? parsed.actionItems.length : 0;
            summary = parsed.summary;
            newTickets = parsed.items;
          }

          const fileEntry = {
            id: fileId,
            name,
            type,
            size: text.length,
            recordCount,
            summary,
            content: text,
            parsedData,
            timestamp: Date.now(),
            isActive: true,
            isQueueLoaded: newTickets.length > 0
          };

          this.uploadedFiles = this.uploadedFiles.filter(f => f.name !== name);
          this.uploadedFiles.unshift(fileEntry);

          if (newTickets.length > 0) {
            if (importMode === 'replace') {
              this.queue = [...newTickets];
              this.showOpSuccess(
                'OP_FILE_REPLACE_QUEUE',
                this.t('opQueueReplacedTitle'),
                `Replaced active queue with ${newTickets.length} tickets from ${name}.`,
                `FILE: ${name}`
              );
            } else {
              this.queue = [...newTickets, ...this.queue];
              this.showOpSuccess(
                'OP_FILE_APPEND_QUEUE',
                this.t('opQueueAppendedTitle'),
                `Appended ${newTickets.length} tickets from ${name} to existing queue.`,
                `FILE: ${name}`
              );
            }
          } else {
            this.showOpSuccess(
              'OP_CONTEXT_LOADED',
              this.t('opContextLoadedTitle'),
              `Loaded knowledge & rule context from ${name}. Gemini 3.5+ will ground responses in this file!`,
              `KNOWLEDGE: ${name}`
            );
          }

          return { ticketCount: newTickets.length };
        },

        formatChatMessage(text) {
          if (!text) return '';
          let escaped = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          // Bold **text**
          escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong class="text-teal-200 font-bold">$1</strong>');
          // Inline code `code`
          escaped = escaped.replace(/`([^`]+)`/g, '<code class="bg-[#0b2434] text-cyan-300 px-1.5 py-0.5 rounded font-mono text-[10px] border border-cyan-500/30">$1</code>');
          // Bullet points
          escaped = escaped.replace(/^[•\-\*]\s+(.+)$/gm, '<div class="flex items-start gap-1.5 ml-0.5 my-0.5"><span class="text-teal-400 font-bold">▸</span><span>$1</span></div>');
          return escaped;
        },
